{% extends 'base.html' %}

{% block title %}Đổi mật khẩu{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <h2 class="fw-bold mb-4"><i class="bi bi-key text-primary"></i> Đổi mật khẩu</h2>

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Mật khẩu hiện tại</label>
                        <input type="password" name="old_password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Mật khẩu mới</label>
                        <input type="password" name="new_password" class="form-control" required minlength="8">
                        <div class="form-text">Tối thiểu 8 ký tự</div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Xác nhận mật khẩu mới</label>
                        <input type="password" name="confirm_password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg"></i> Đổi mật khẩu
                    </button>
                    <a href="{% url 'accounts:profile' %}" class="btn btn-outline-secondary ms-2">Quay lại</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
