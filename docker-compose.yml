services:
  postgres:
    image: postgres:16-alpine
    container_name: los_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - los_net

  minio:
    image: minio/minio:latest
    container_name: los_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - los_net

  minio_init:
    image: minio/mc:latest
    container_name: los_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_MLFLOW: ${MINIO_BUCKET_MLFLOW}
      MINIO_BUCKET_DVC: ${MINIO_BUCKET_DVC}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb -p local/$${MINIO_BUCKET_MLFLOW} || true;
      mc mb -p local/$${MINIO_BUCKET_DVC} || true;
      echo 'MinIO buckets ready';
      "
    networks:
      - los_net

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.18.0
    container_name: los_mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "5000:5000"
    command: >
      /bin/bash -c "
      pip install --quiet psycopg2-binary boto3 &&
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      --default-artifact-root s3://${MINIO_BUCKET_MLFLOW}/
      --host 0.0.0.0
      --port 5000
      "
    networks:
      - los_net

  redis:
    image: redis:7-alpine
    container_name: los_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - los_net

  # ── Giai đoạn 5: FastAPI inference service ───────────────────────────────
  fastapi:
    build:
      context: ./fastapi_service
      dockerfile: Dockerfile
    container_name: los_fastapi
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
    env_file:
      - .env
    environment:
      # Override URLs để trỏ vào Docker internal hostnames
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      FEAST_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      # Cho FastAPI truy cập ml_models & CSV trên host qua volume mount
      ML_MODELS_DIR: /app/ml_models
      CSV_DATA_PATH: /app/LengthOfStay.csv
    ports:
      - "8001:8001"
    volumes:
      - ./ml_models:/app/ml_models:ro
      - ./LengthOfStay.csv:/app/LengthOfStay.csv:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v2/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - los_net

  # ── Giai đoạn 5: Nginx reverse proxy ─────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: los_nginx
    restart: unless-stopped
    depends_on:
      fastapi:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      # Cho phép Nginx trỏ vào Django chạy trên host machine
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - los_net

volumes:
  postgres_data:
  minio_data:
  redis_data:

networks:
  los_net:
    driver: bridge
