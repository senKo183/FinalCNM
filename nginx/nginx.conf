events {
    worker_connections 1024;
}

http {
    # Django (chạy local trên host machine)
    # host.docker.internal trỏ về host từ trong Docker container
    upstream django_app {
        server host.docker.internal:8000;
    }

    # FastAPI inference service (Docker container)
    upstream fastapi_app {
        server fastapi:8001;
    }

    # MLflow UI (Docker container)
    upstream mlflow_app {
        server mlflow:5000;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 50M;

        # ── FastAPI inference API ─────────────────────────────────────────
        location /api/v2/ {
            proxy_pass http://fastapi_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ── MLflow UI (admin access) ──────────────────────────────────────
        location /mlflow/ {
            rewrite ^/mlflow/(.*) /$1 break;
            proxy_pass http://mlflow_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ── Django main app (mọi request còn lại) ────────────────────────
        location / {
            proxy_pass http://django_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # Health check endpoint cho load balancer
        location /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
